# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
databases:
  - name: brightloop-db
    databaseName: brightloop
    user: brightloop
    region: singapore
    plan: 0.5c-1g
    postgresMajorVersion: "17"
    ipAllowList: []
services:
  - type: web
    name: brightloop-web
    runtime: node
    region: singapore
    plan: 1c-2g
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: CHECKPOINT_DISABLE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: brightloop-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: BUSINESS_TIMEZONE
        value: Asia/Kolkata
      - key: APP_CURRENCY
        value: INR
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
  - type: worker
    name: brightloop-billing
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run db:generate
    startCommand: npm run worker
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: CHECKPOINT_DISABLE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: brightloop-db
          property: connectionString
      - key: BETTER_AUTH_URL
        fromService:
          type: web
          name: brightloop-web
          envVarKey: BETTER_AUTH_URL
      - key: STRIPE_SECRET_KEY
        fromService:
          type: web
          name: brightloop-web
          envVarKey: STRIPE_SECRET_KEY
